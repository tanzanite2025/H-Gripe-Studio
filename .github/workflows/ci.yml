name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Opt-in end-to-end checks that run real model inference: the weights are
  # never committed, so the gated tests (`vitmatte_inference_when_weight_present`,
  # `test_realesrgan_real_inference_when_stack_present`,
  # `test_{sd_inpaint,sdxl_inpaint,flux_fill}_real_inference_with_tiny_snapshot`,
  # `test_diffusion_sr_real_inference_with_tiny_snapshot`,
  # `test_onnx_matting_real_inference_when_weight_present`,
  # `onnx_defect_inference_when_weight_present`) skip on every normal
  # run. Trigger this manually to fetch/synthesise the weights and exercise the
  # real inference paths.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-ui:
    name: studio-ui (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri/studio-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  tauri-rust:
    name: tauri (cargo test)
    runs-on: windows-latest
    steps:
      # lfs: true pulls the vendored FFmpeg import libs/DLLs under
      # third_party/ffmpeg that the native-ffmpeg feature links against.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      # The Tauri build script embeds the frontend at compile time, so the
      # studio-ui bundle (apps/desktop-tauri/dist) must exist before cargo test.
      - name: Build frontend
        working-directory: apps/desktop-tauri
        run: npm --prefix studio-ui ci && npm --prefix studio-ui run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      # Formatting gate: keeps the tree rustfmt-clean so functional diffs never
      # drown in whitespace churn. Runs before the (much slower) test build.
      - name: cargo fmt --check
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo test
        working-directory: apps/desktop-tauri/src-tauri
        # Default features include native-ffmpeg: links + smoke-tests the
        # vendored libav decode/encode (build.rs copies the runtime DLLs next
        # to the test binaries).
        run: cargo test

      - name: cargo test (no native-ffmpeg)
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test --no-default-features

  vitmatte-e2e:
    name: tauri (vitmatte e2e)
    # Only on manual dispatch: fetches the ~104 MB weight and runs the real
    # ViTMatte inference test. Kept out of the per-PR matrix to avoid the
    # download on every run while still giving a verifiable execution path.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ViTMatte uses the repository-maintained ONNX Runtime DLLs.
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      # The Tauri build script embeds the frontend at compile time, so the
      # studio-ui bundle (apps/desktop-tauri/dist) must exist before cargo test.
      - name: Build frontend
        working-directory: apps/desktop-tauri
        run: npm --prefix studio-ui ci && npm --prefix studio-ui run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      # Fetches into resources/models/vitmatte.onnx (sha256-checked), which
      # the shared ViTMatte resolver picks up so both gated tests stop skipping.
      - name: Fetch ViTMatte weight
        shell: bash
        run: bash scripts/fetch-vitmatte.sh

      - name: cargo test (vitmatte inference)
        working-directory: apps/desktop-tauri/src-tauri
        run: |
          cargo test vitmatte_inference_when_weight_present -- --nocapture
          cargo test onnx_matting_runs_when_weight_present -- --nocapture

  watchdog-e2e:
    name: tauri (detail watchdog e2e)
    # Only on manual dispatch: fetches the small trained PP-OCRv3 text weight
    # and proves the native Rust/ORT detector emits a real garbled_text box.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      - name: Build frontend
        working-directory: apps/desktop-tauri
        run: npm --prefix studio-ui ci && npm --prefix studio-ui run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: Fetch Detail Watchdog text weight
        shell: pwsh
        run: .\scripts\fetch-watchdog-text.ps1

      - name: cargo test (trained text detector)
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test onnx_defect_inference_when_weight_present -- --nocapture

  no-python-spawn:
    name: no python spawn (grep gate)
    # Phase 7 gate: the runtime is native-only, so no Rust source may spawn a
    # Python interpreter and the deleted python/bridge / third_party/psd_tools
    # trees must not reappear.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Python runtime remnants
        shell: bash
        run: |
          set -euo pipefail
          if [ -e python ] || [ -e third_party/psd_tools ] || [ -e pyproject.toml ]; then
            echo 'Python runtime trees must stay deleted (python/, third_party/psd_tools, pyproject.toml)'
            exit 1
          fi
          if grep -rnE 'Command::new\([^)]*python' apps crates plugins --include='*.rs'; then
            echo 'Rust source must not spawn a Python interpreter'
            exit 1
          fi
