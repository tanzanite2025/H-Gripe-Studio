name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-ui:
    name: studio-ui (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop-tauri/studio-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

  tauri-rust:
    name: tauri (cargo test)
    runs-on: windows-latest
    steps:
      # lfs: true pulls the vendored FFmpeg import libs/DLLs under
      # third_party/ffmpeg that the native-ffmpeg feature links against.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop-tauri/studio-ui/package-lock.json

      # The Tauri build script embeds the frontend at compile time, so the
      # studio-ui bundle (apps/desktop-tauri/dist) must exist before cargo test.
      - name: Build frontend
        working-directory: apps/desktop-tauri
        run: npm --prefix studio-ui ci && npm --prefix studio-ui run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop-tauri/src-tauri

      - name: cargo fmt --check
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo test
        working-directory: apps/desktop-tauri/src-tauri
        # Default features include native-ffmpeg: links + smoke-tests the
        # vendored libav decode/encode (build.rs copies the runtime DLLs next
        # to the test binaries).
        run: cargo test

      - name: cargo test (no native-ffmpeg)
        working-directory: apps/desktop-tauri/src-tauri
        run: cargo test --no-default-features

  no-python-spawn:
    name: no python spawn (grep gate)
    # The runtime is native-only, so no Rust source may spawn a Python
    # interpreter and the deleted python/bridge / third_party/psd_tools trees
    # must not reappear.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Python runtime remnants
        shell: bash
        run: |
          set -euo pipefail
          if [ -e python ] || [ -e third_party/psd_tools ] || [ -e pyproject.toml ]; then
            echo 'Python runtime trees must stay deleted (python/, third_party/psd_tools, pyproject.toml)'
            exit 1
          fi
          if grep -rnE 'Command::new\([^)]*python' apps crates plugins --include='*.rs'; then
            echo 'Rust source must not spawn a Python interpreter'
            exit 1
          fi
