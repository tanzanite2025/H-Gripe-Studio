[package]
name = "hgripe-raw-evidence"
version = "0.1.0"
edition = "2021"
description = "Windows R0 RAW corpus validation and evidence runner"
publish = false

[dependencies]
hgripe-raw = { path = "../hgripe-raw" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[[bin]]
name = "hgripe-raw-evidence"
path = "src/bin/hgripe_raw_evidence.rs"
