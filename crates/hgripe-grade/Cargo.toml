[package]
name = "hgripe-grade"
version = "0.1.0"
edition = "2021"
description = "Standalone f32 colour-grading kernel (see docs/design/grade-kernel.md)"
publish = false

# The kernel core is deliberately dependency-free f32 array code. serde only
# exists so the op graph / golden vectors are serialisable; rayon is the
# design doc's sanctioned optional feature for row-parallel application
# (must stay bit-identical to the serial path — asserted in tests). Nothing
# else is allowed in without updating docs/design/grade-kernel.md.
[dependencies]
serde = { version = "1", features = ["derive"] }
rayon = { version = "1", optional = true }
# The design doc's sanctioned GPU backend (grade-kernel.md "GPU backend"):
# wgpu compute passes generated from the same GradeDoc op graph. The CPU
# path stays the reference implementation; the GPU path is validated
# against it with tolerance tests and is preview-grade, not bit-identical.
wgpu = { version = "29.0.3", optional = true, default-features = false, features = ["dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }

[features]
parallel = ["dep:rayon"]
gpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
serde_json = "1"

[[example]]
name = "bench"
