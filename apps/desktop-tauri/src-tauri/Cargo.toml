[package]
name = "hgripe-desktop"
version = "0.1.0"
edition = "2021"
description = "H-Gripe API-first desktop shell"
publish = false

[[bin]]
name = "hgripe-desktop"
path = "src/main.rs"

[features]
default = ["native-ffmpeg", "grade-gpu", "viewport-surface"]
# Native in-process FFmpeg backend: decode (`FrameSource` behind the
# media-engine seam) plus encode (`videoTrim`/`videoAssemble`), linked against
# the vendored LGPL *shared* libav* libraries checked into `third_party/ffmpeg`
# via git-lfs — cut from upstream and locally maintained, with no system FFmpeg
# or subprocess fallback. On by default: probe/decode/poster/trim/assemble all
# run in-process through libav. Builds without this feature reject video
# operations explicitly. The `FFMPEG_*` link/binding env for `rusty_ffmpeg` lives in
# `.cargo/config.toml`, and `build.rs` copies the runtime DLLs next to the
# test/app binaries.
native-ffmpeg = ["dep:rusty_ffmpeg"]
# GPU backend for the grading dialog preview (`grade_preview`) and the
# `imageGrade` node: compiles hgripe-grade's wgpu compute passes in. On by
# default; when no adapter initialises at runtime (or with
# `--no-default-features`) grading falls back to the kernel's row-parallel
# CPU reference path.
grade-gpu = ["hgripe-grade/gpu"]
# Native WGPU surface presentation for heavy viewports (WGPU_SURFACE_SWAP_PLAN):
# compiles the shared wgpu device + surface path in. Device init is lazy —
# nothing runs at app startup — and when no adapter is available at runtime the
# viewport host keeps the PNG/blob transport and reports the fallback.
viewport-surface = ["dep:wgpu", "dep:pollster", "dep:windows-sys", "dep:windows"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native file-open dialog for the node editor (pick_file command). Invoked from
# Rust, so no frontend capability/permission entry is required.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time", "sync"] }
# Shared still-image decode/encode surface. Keep the enabled codecs aligned with
# the product contract in studio-ui/src/domain/mediaFormats.ts. HEIC/HEIF/AVIF
# use the native FFmpeg path; formats outside this list are intentionally not
# pulled into the offline Cargo snapshot.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "bmp",
  "tiff",
] }
# Direct PNG encoder for the in-process enhance output so it can embed a source
# ICC profile (iCCP). Already in the tree transitively via `image`; pinned here
# to use its API directly.
png = "0.17"
# Data-parallelism for CPU-bound image operators (e.g. mask morphology). Runs on
# the Compute lane's worker threads, independent of the GPU serialization gate.
rayon = "1"
# Native in-process FFmpeg decoder (feature `native-ffmpeg`). Linked against the
# vendored LGPL shared libav* under third_party/ffmpeg via the FFMPEG_* env in
# `.cargo/config.toml`; `use_prebuilt_binding` ships FFmpeg 8 bindings (matching
# the vendored 8.1 libs) so no libclang/bindgen is needed on CI. `ffmpeg8_1`
# aligns the version cfgs with those libs.
rusty_ffmpeg = { version = "0.17", default-features = false, features = ["ffmpeg8_1", "use_prebuilt_binding"], optional = true }
# TIFF remains a supported digital-media container and is used directly for
# 16-bit RGB/RGBA working-surface I/O.
tiff = "0.11"
# Colour management for the sRGB / ProPhoto working-surface boundary only.
moxcms = { version = "0.8.1", default-features = false }
# Stable content hash for the media index/cache fingerprints (studio/media_index.rs).
# Already in the tree via hgripe-api.
sha2 = "0.10"
hgripe-api = { path = "../../../crates/hgripe-api" }
# The standalone f32 colour-grading kernel (docs/design/grade-kernel.md):
# runs the `imageGrade` node and the grading dialog's `grade_preview` command.
# `parallel` is the design doc's sanctioned rayon row-parallel apply path.
hgripe-grade = { path = "../../../crates/hgripe-grade", features = ["parallel"] }
# Shared viewport-surface device (feature `viewport-surface`): the same wgpu
# pinned by hgripe-grade's gpu backend, with surface presentation compiled in.
wgpu = { version = "29.0.3", optional = true, default-features = false, features = ["dx12", "metal", "vulkan", "wgsl"] }
pollster = { version = "0.4", optional = true }

[target."cfg(windows)".dependencies]
# Win32 child windows for native viewport surface presentation (feature
# `viewport-surface`, plan Phase S1): one hidden, input-transparent child HWND
# per presented viewport, kept below the webview in z-order.
# D3D11/D3D12 interop for the video zero-copy route (`d3d11_wgpu`): opening
# the FFmpeg D3D11VA decode device, converting decoded NV12 texture slices
# through the D3D11 video processor into a D3D12-shared BGRA texture, and
# wrapping that resource as a wgpu texture. Pinned to the same `windows` major
# as wgpu-hal's dx12 backend so raw COM types line up.
windows = { version = "0.62", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
] }
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
